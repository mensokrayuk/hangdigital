  <style>
    :root {

    body {

      font-family: 'Kantumruy Pro', sans-serif;
      margin: 0;

      display: flex;
      justify-content: center;

    /* Animated Canvas Background */
    #starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    /* Profile Glow Animation */
    .profile-glow {
      position: relative;
    }
    .profile-glow::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(45deg, #a855f7, #ec4899, #3b82f6, #a855f7);
      background-size: 400%;
      z-index: -1;
      animation: spinGlow 8s linear infinite;
      filter: blur(8px);
      opacity: 0.7;
    }

    @keyframes spinGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Premium Glassmorphism Cards */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 1.25rem;
      margin-bottom: 1rem;
      text-decoration: none;
      color: white;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(30px);
      animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Staggered entrance animations */
    .link-card:nth-child(1) { animation-delay: 0.2s; }
    .link-card:nth-child(2) { animation-delay: 0.35s; }
    .link-card:nth-child(3) { animation-delay: 0.5s; }

    .link-card:hover {
      transform: translateY(-5px) scale(1.02);
      background: var(--card-hover);
      border-color: rgba(168, 85, 247, 0.5);
      box-shadow: 0 10px 40px -10px rgba(168, 85, 247, 0.6);
    }

    /* Card Icon Container */
    .icon-box {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
    }

    @keyframes slideUpFade {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Sleek Audio Player */
    #audio-control {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 28px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    #audio-control:hover {
      background: rgba(168, 85, 247, 0.2);
      border-color: rgba(168, 85, 247, 0.5);
      transform: translateX(-50%) translateY(-3px);
    }

    .music-waves {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 15px;
    }
    .wave {
      width: 3px;
      background-color: #a855f7;
      border-radius: 3px;
      height: 3px;
      transition: height 0.2s ease;
    }
    .playing .wave {
      animation: bounceWave 1s ease-in-out infinite alternate;
    }
    .playing .wave:nth-child(2) { animation-delay: 0.2s; }
    .playing .wave:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounceWave {
      0% { height: 3px; }
      100% { height: 15px; }
    }

  <script>
    // --- 1. PROFESSIONAL STARFIELD ANIMATION LOOP ---
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let shootingStars = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Star Class for Parallax & Twinkle
    class Star {
      constructor() {
        this.reset(true);
      }
      reset(randomY = false) {
        this.x = Math.random() * canvas.width;
        // Start randomly on screen initially, otherwise spawn at bottom
        this.y = randomY ? Math.random() * canvas.height : canvas.height + 10;
        this.size = Math.random() * 1.5 + 0.1;
        // Parallax effect: bigger stars move faster
        this.speed = (this.size * 0.3) + 0.1;
        this.opacity = Math.random();
        this.fadeSpeed = (Math.random() * 0.02) + 0.005;
        this.fadingOut = Math.random() > 0.5;
      }
      update() {
        // Move upward
        this.y -= this.speed;
        
        // Loop back to bottom when off-screen
        if (this.y < -10) this.reset();

        // Twinkle effect
        if (this.fadingOut) {
          this.opacity -= this.fadeSpeed;
          if (this.opacity <= 0.1) this.fadingOut = false;
        } else {
          this.opacity += this.fadeSpeed;
          if (this.opacity >= 1) this.fadingOut = true;
        }
      }
      draw() {
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Shooting Star Class for Extra Polish
    class ShootingStar {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width * 1.5;
        this.y = 0;
        this.len = Math.random() * 80 + 30;
        this.speed = Math.random() * 10 + 6;
        this.size = Math.random() * 1 + 0.5;
        this.opacity = 0;
        this.active = false;
        this.delay = Math.random() * 200 + 100; // Random delay between appearances
        this.timer = 0;
      }
      update() {
        if (!this.active) {
          this.timer++;
          if (this.timer > this.delay) {
            this.active = true;
            this.opacity = 1;
          }
          return;
        }
        
        this.x -= this.speed;
        this.y += this.speed;
        this.opacity -= 0.015;

        if (this.opacity <= 0 || this.x < 0 || this.y > canvas.height) {
          this.reset();
        }
      }
      draw() {
        if (!this.active) return;
        ctx.globalAlpha = this.opacity;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
        ctx.lineWidth = this.size;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x + this.len, this.y - this.len);
        ctx.stroke();
      }
    }

    // Initialize Stars
    for (let i = 0; i < 200; i++) stars.push(new Star());
    for (let i = 0; i < 3; i++) shootingStars.push(new ShootingStar());

    // Animation Loop
    function animateStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      stars.forEach(star => {
        star.update();
        star.draw();
      });

      shootingStars.forEach(ss => {
        ss.update();
        ss.draw();
      });

      requestAnimationFrame(animateStars);
    }
    animateStars();


    // --- 2. AUDIO CONTROL ---
    const audio = document.getElementById('bg-music');
    const audioBtn = document.getElementById('audio-control');
    const audioText = document.getElementById('audio-text');
    const waves = document.getElementById('waves');
    
    // Lower volume slightly so it's pleasant background music
    audio.volume = 0.4; 

    audioBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        waves.classList.add('playing');
        audioText.textContent = "កំពុងចាក់ (Playing)";
      } else {
        audio.pause();
        waves.classList.remove('playing');
        audioText.textContent = "ចាក់តន្ត្រី (Play)";
      }
    });
  </script>
